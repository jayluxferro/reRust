[project]
name = "rerust"
version = "0.1.1"
description = "Traffic interception for Rust-based mobile apps — reFlutter for rustls/reqwest cores"
readme = "README.md"
license = "MIT"
authors = [{ name = "jayluxferro" }]
keywords = ["rustls", "reqwest", "mitm", "burp", "android", "reverse-engineering", "flutter", "frida"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/jayluxferro/reRust"
Issues = "https://github.com/jayluxferro/reRust/issues"

[project.scripts]
rerust = "rerust.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/rerust"]

# Package the asset trees so an installed wheel works without a repo checkout.
# Resolution at runtime: rerust.assets (repo checkout preferred, else these).
[tool.hatch.build.targets.wheel.force-include]
"shim" = "rerust/assets/shim"
"patterns" = "rerust/assets/patterns"
