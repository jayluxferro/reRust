anchor_swap:
  status: not-applicable
  why: >
    4.3.7's librhttp carried a parsed webpki-roots TrustAnchor table
    (135 x 0x48 struct slots) that T2 could edit slot-wise. 4.4.6's librhttp
    does NOT: a full census of .rela.dyn (14,628 relocs) finds NO 0x48-stride
    TrustAnchor array. The roots exist as PACKED raw-DER certificates in
    .rodata (first blobs at file 0x5bfc0 = GlobalSign-class certs,
    0x5c1dd = ISRG X1-class, back-to-back runs found up to 0x74458+) referenced
    through [CertificateDer]-style 0x18-byte records {ptr(reloc), len, disc}
    (an array of them starts near file 0x59f0e8 with lens 0x21d / 0x5ad /
    0x584 / ... matching the packed cert sizes; disc word 0xffffffffffffffff
    = Borrowed). The LIVE verifier (census D) additionally builds its
    webpki::TrustAnchor views from its own 0x98-byte packed records at
    runtime, so there is no static per-anchor struct to edit even in
    principle — the T2 slot-swap recipe has no host, which is precisely why
    the active patch stubs the verifier instead of swapping anchors.
  override_path: >
    Use the code patch above (T1). If a T2-equivalent is ever needed for this
    target, it would have to rewrite the packed cert pool + its slice records
    AND the 0x98-byte records the D verifier consumes (a blob-level
    transplant, not a slot edit) — design that against the walkthrough's §8
    method with the packed-pool geometry recorded here.

runtime_findings: |
    BENCH 1 (2026-10-02, webpki patch active): repack applied A's patch
    (0x360868) + env-redirect shim (http://127.0.0.1:9999); no-root
    emulator bench, adb reverse tcp:9999 -> mitmdump. RESULT: shim redirect
    WORKS (librhttp sessions reach mitmdump), every TLS handshake FAILS:
    `tlsv1 alert unknown ca` for *.the app backend / tmproxy.the app backend; silent
    client disconnects for api.themoviedb.org (a different, non-rustls
    stack — flutter/platform TLS, unaffected by any of this).
    BENCH 2 (platform patch active, same harness): IDENTICAL failure
    signature. Since rustls 0.23.40 maps CertificateError::UnknownIssuer ->
    UnknownCA (error.rs:642) and UnknownCA is what mitmdump logs, both
    benches were genuine unpatched-trust rejections — so the live
    verify_server_cert was neither A nor C, which drove the four-verifier
    census and the D discovery (ACTIVE-PATCH VERDICT).
    BENCH 3 (2026-10-02, D patch @0x3fe558 active): PASS — first successful
    end-to-end interception of this stack. Same harness (baked env shim
