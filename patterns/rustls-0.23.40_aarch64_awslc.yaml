  #     fd 03 ?? 91 ff ?? ?? d1
  #     ?? 03 02 aa ?? 03 08 aa ?? 03 03 aa 28 88 40 a9 ?? 03 00 aa
  #     a0 ?? ?? d1 ?? 03 1f 2a ?? 03 07 aa ba ?? ?? d1 f8 ?? ?? 91 ?? 03 08 aa ?? ?? ?? 9?
